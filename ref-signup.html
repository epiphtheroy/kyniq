<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyniq — reference: sign up</title>
<link rel="stylesheet" href="globals.css">
</head>
<body>
<main class="shell" style="max-width:420px;">

  <div style="text-align:center;margin:24px 0 26px;">
    <a href="/" class="logo" style="font-size:26px;">Kyniq</a>
    <div class="tagline" style="margin-top:6px;">Read films closely.</div>
  </div>

  <h1 class="disp" style="font-size:22px;margin:0 0 18px;text-align:center;">Join the conversation</h1>

  <div style="display:flex;flex-direction:column;gap:11px;">
    <div class="field muted">Email</div>
    <div class="field muted">Password</div>
    <a href="#" class="btn" style="text-align:center;">Create account</a>
  </div>

  <div class="ui muted" style="text-align:center;font-size:12px;margin:16px 0;">or</div>

  <a href="#" class="field" style="display:block;text-align:center;text-decoration:none;color:var(--ink);">Continue with Google</a>

  <p class="ui muted" style="font-size:11.5px;line-height:1.6;text-align:center;margin:18px 0 0;">
    By joining you agree to our <a href="/terms" class="accent" style="text-decoration:none;">Terms</a> and
    <a href="/privacy" class="accent" style="text-decoration:none;">Privacy Policy</a>. We'll email a link to verify your address.
  </p>

  <p class="ui" style="font-size:13px;text-align:center;margin-top:20px;">
    Already have an account? <a href="/login" class="accent" style="text-decoration:none;">Sign in</a>
  </p>

  <footer class="site-footer" style="margin-top:40px;text-align:center;">
    <div class="footer-baseline" style="justify-content:center;border-top:none;padding-top:0;">
      <span>© 2026 Kyniq · <a href="/terms" class="footer-link" style="display:inline;">Terms</a> · <a href="/privacy" class="footer-link" style="display:inline;">Privacy</a></span>
    </div>
  </footer>

</main>
</body>
</html>
