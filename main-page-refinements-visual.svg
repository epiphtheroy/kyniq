    <text x="546" y="298" font-family="Georgia,serif" font-size="14.5" font-weight="700" fill="#0D0D0D">빨강 선을 메타테이크 중심에 정렬 · 매 회전 재드로</text>
    <text x="546" y="316" font-size="11.5" fill="#6B6B6B">선이 어긋나지 않게 제목 수직 중심 기준 재계산(리사이즈·회전마다 다시 그리기).</text>
    <rect x="1108" y="290" width="11" height="11" fill="#E3120B"/>
    <!-- 5 -->
    <circle cx="524" cy="350" r="11" fill="#E3120B"/><text x="524" y="354" font-size="12" font-weight="700" fill="#FFF" text-anchor="middle">5</text>
    <text x="546" y="348" font-family="Georgia,serif" font-size="14.5" font-weight="700" fill="#0D0D0D">첫 페인트 SSR — 히어로·카운터 비어보임 방지</text>
    <text x="546" y="366" font-size="11.5" fill="#6B6B6B">최초 페어 1쌍·카운터 목표값을 서버에서 먼저. JS는 회전·애니메이션만. 백드롭 onload 페이드.</text>
    <rect x="1108" y="340" width="11" height="11" fill="#E3120B"/>
    <!-- 6 -->
    <circle cx="524" cy="400" r="11" fill="#0D0D0D"/><text x="524" y="404" font-size="12" font-weight="700" fill="#FFF" text-anchor="middle">6</text>
    <text x="546" y="398" font-family="Georgia,serif" font-size="14.5" font-weight="700" fill="#0D0D0D">별자리 — 노드 클릭→실제 페이지 · 라벨 가독성</text>
    <text x="546" y="416" font-size="11.5" fill="#6B6B6B">"click to travel" 실링크, hover 시 라벨만 또렷(겹침 방지), 화면 밖이면 애니 정지.</text>
    <rect x="1108" y="390" width="11" height="11" fill="#0D0D0D"/>
    <!-- 7 -->
    <circle cx="524" cy="450" r="11" fill="#0D0D0D"/><text x="524" y="454" font-size="12" font-weight="700" fill="#FFF" text-anchor="middle">7</text>
    <text x="546" y="448" font-family="Georgia,serif" font-size="14.5" font-weight="700" fill="#0D0D0D">Just added — 여러 항목 7초 순환 + 엔티티 색</text>
    <text x="546" y="466" font-size="11.5" fill="#6B6B6B">현재 1개만 노출. 최근 추가분 여러 개 순환, 메타=빨강/트로프=틸 등 색 태그.</text>
    <rect x="1108" y="440" width="11" height="11" fill="#0D0D0D"/>
    <!-- 8 -->
    <circle cx="524" cy="500" r="11" fill="#0D0D0D"/><text x="524" y="504" font-size="12" font-weight="700" fill="#FFF" text-anchor="middle">8</text>
    <text x="546" y="498" font-family="Georgia,serif" font-size="14.5" font-weight="700" fill="#0D0D0D">갤러리↔히어로 연동 · 진입문 카운트 일치</text>
    <text x="546" y="516" font-size="11.5" fill="#6B6B6B">갤러리 클릭→히어로 로드+active. 진입문 "935 hubs" 등은 카운터와 같은 소스로.</text>
    <rect x="1108" y="490" width="11" height="11" fill="#0D0D0D"/>
    <!-- 9 -->
    <circle cx="524" cy="550" r="11" fill="#0D0D0D"/><text x="524" y="554" font-size="12" font-weight="700" fill="#FFF" text-anchor="middle">9</text>
    <text x="546" y="548" font-family="Georgia,serif" font-size="14.5" font-weight="700" fill="#0D0D0D">용어 통일 — "Meta takes" (하이픈 혼재 제거)</text>
    <text x="546" y="566" font-size="11.5" fill="#6B6B6B">네비 "Meta takes" / 카운터 "META-TAKES" / 사슬 "Meta-take" 혼재 → 한 표기로.</text>
    <rect x="1108" y="540" width="11" height="11" fill="#0D0D0D"/>
    <!-- 10 -->
    <circle cx="524" cy="600" r="11" fill="#9A9A9A"/><text x="524" y="604" font-size="12" font-weight="700" fill="#FFF" text-anchor="middle">10</text>
    <text x="546" y="598" font-family="Georgia,serif" font-size="14.5" font-weight="700" fill="#0D0D0D">reduced-motion · 접근성 · 반응형 · 성능</text>
    <text x="546" y="616" font-size="11.5" fill="#6B6B6B">모션 줄이기 존중, alt·포커스 링·대비, 모바일 스택(선=세로), 캔버스 뷰포트 진입 시 init.</text>
