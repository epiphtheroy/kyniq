  <g>
    <!-- row template: pin, title, desc, ptag -->
    <!-- 1 -->
    <circle cx="524" cy="150" r="11" fill="#E3120B"/><text x="524" y="154" font-size="12" font-weight="700" fill="#FFF" text-anchor="middle">1</text>
    <text x="546" y="148" font-family="Georgia,serif" font-size="14.5" font-weight="700" fill="#0D0D0D">갤러리 10쌍 — 영화·메타테이크 중복 제거</text>
    <text x="546" y="166" font-size="11.5" fill="#6B6B6B">현재 The Favourite ×3, "The Emotional Landscape" ×2. → 영화·메타테이크 중복 0으로 큐레이션(다양성).</text>
    <rect x="1108" y="140" width="11" height="11" fill="#E3120B"/>
    <!-- 2 -->
    <circle cx="524" cy="200" r="11" fill="#E3120B"/><text x="524" y="204" font-size="12" font-weight="700" fill="#FFF" text-anchor="middle">2</text>
    <text x="546" y="198" font-family="Georgia,serif" font-size="14.5" font-weight="700" fill="#0D0D0D">카운터 — 큰 수 안정 카운트업 + 천단위 콤마</text>
    <text x="546" y="216" font-size="11.5" fill="#6B6B6B">스냅샷에서 0. 스크롤 진입 시 0→실값(46,503) ease-out, 콤마, Nodes 실값 확인, 가끔 +1 라이브.</text>
    <rect x="1108" y="190" width="11" height="11" fill="#E3120B"/>
    <!-- 3 -->
    <circle cx="524" cy="250" r="11" fill="#E3120B"/><text x="524" y="254" font-size="12" font-weight="700" fill="#FFF" text-anchor="middle">3</text>
    <text x="546" y="248" font-family="Georgia,serif" font-size="14.5" font-weight="700" fill="#0D0D0D">히어로 "via [figure]" 긴 텍스트 → 2줄 클램프</text>
    <text x="546" y="266" font-size="11.5" fill="#6B6B6B">긴 figure 문구가 카드 높이를 어긋나게. 2줄 말줄임 + 좌우 카드 상단 정렬 고정.</text>
    <rect x="1108" y="240" width="11" height="11" fill="#E3120B"/>
    <!-- 4 -->
