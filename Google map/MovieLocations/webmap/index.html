document.getElementById("nn").textContent=DATA.features.length;
const PREC={exact:["#2ecc71","정밀(건물/랜드마크)"],street:["#3fb6f5","도로명 수준"],
  set:["#b07cf5","스튜디오/세트"],area:["#f5a623","지역 중심"],region:["#e8554e","광역 근사"]};
let active=new Set(Object.keys(PREC));
document.querySelector(".legend").innerHTML="<b>좌표 정밀도</b>"+Object.entries(PREC).map(([k,v])=>`<span><i class="dot" style="background:${v[0]}"></i>${v[1]}</span>`).join("");
const fl=document.getElementById("filters");
Object.entries(PREC).forEach(([k,v])=>{const c=document.createElement("div");c.className="chip";c.style.background=v[0];
  c.innerHTML=`<span class="dot" style="background:#0e1116"></span>${v[1].split("(")[0]}`;
  c.onclick=()=>{const off=c.classList.toggle("off");off?active.delete(k):active.add(k);apply();};fl.appendChild(c);});

const STYLES={street:"https://tiles.openfreemap.org/styles/positron",
  satellite:{version:8,glyphs:"https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf",
    sources:{sat:{type:"raster",tileSize:256,maxzoom:19,attribution:"Imagery © Esri",
        tiles:["https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"]},
      satref:{type:"raster",tileSize:256,maxzoom:19,tiles:["https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}"]}},
    layers:[{id:"sat",type:"raster",source:"sat"},{id:"satref",type:"raster",source:"satref",paint:{"raster-opacity":.9}}]}};
let base="street";
const map=new maplibregl.Map({container:"map",style:STYLES.street,center:[10,30],zoom:1.4,attributionControl:true});
map.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-left");
const PCOLOR=["match",["get","precision"],"exact","#2ecc71","street","#3fb6f5","set","#b07cf5","area","#f5a623","region","#e8554e","#888"];
function fdata(){return {type:"FeatureCollection",features:DATA.features.filter(f=>active.has(f.properties.precision))};}
function addLayers(){
  if(!map.getSource("locs"))map.addSource("locs",{type:"geojson",data:fdata(),cluster:true,clusterRadius:42,clusterMaxZoom:6});
  if(!map.getLayer("cl"))map.addLayer({id:"cl",type:"circle",source:"locs",filter:["has","point_count"],
    paint:{"circle-color":"#f5a623","circle-radius":["step",["get","point_count"],15,5,20,15,27],"circle-opacity":.9,"circle-stroke-width":2,"circle-stroke-color":"#0e1116"}});
  if(!map.getLayer("clc"))map.addLayer({id:"clc",type:"symbol",source:"locs",filter:["has","point_count"],layout:{"text-field":["get","point_count_abbreviated"],"text-size":12,"text-font":["Noto Sans Regular"]},paint:{"text-color":"#0e1116"}});
  if(!map.getLayer("pt"))map.addLayer({id:"pt",type:"circle",source:"locs",filter:["!",["has","point_count"]],
    paint:{"circle-color":PCOLOR,"circle-radius":6,"circle-stroke-width":1.5,"circle-stroke-color":"#0e1116"}});
}
map.on("click","cl",e=>{const f=map.queryRenderedFeatures(e.point,{layers:["cl"]})[0];
  map.getSource("locs").getClusterExpansionZoom(f.properties.cluster_id).then(z=>map.easeTo({center:f.geometry.coordinates,zoom:z}));});
map.on("click","pt",e=>popup(e.features[0]));
map.on("mouseenter","pt",()=>map.getCanvas().style.cursor="pointer");map.on("mouseleave","pt",()=>map.getCanvas().style.cursor="");
map.on("mouseenter","cl",()=>map.getCanvas().style.cursor="pointer");map.on("mouseleave","cl",()=>map.getCanvas().style.cursor="");
map.on("moveend",refresh);
map.on("load",()=>{addLayers();refresh();});
const CONF={verified:"#2ecc71",verified_set_not_real:"#b07cf5",probable:"#f5a623",weak:"#e8554e"};
function popup(f){const p=f.properties;const pc=PREC[p.precision];
  const setline = p.built_set ? `<div class="kv" style="margin-top:5px">🎭 <b>세트 촬영</b>${p.set_host?` · ${p.set_host}`:""}</div>` : "";
  const html=`<div class="mv">${p.movie} (${p.year})</div><h3>${p.real_name}</h3>
    <div class="role"><div class="rl">영화 속 장소</div><div class="rt">${p.narrative||"—"}</div></div>
    <div class="role"><div class="rl">스크린 속 역할 (장면)</div><div class="rt">${p.scene_role||"—"}</div></div>
    ${setline}
    <div class="addr"><b>📍 ${p.geocode_basis==="address"?"주소":"실제장소(주소없음)"}</b><br>${p.resolved_query}<br>
      <span class="kv">${p.lat}, ${p.lng}</span></div>
    <div class="kv"><span class="badge" style="background:${pc[0]}">${pc[1]}</span>
      <span class="badge" style="background:${CONF[p.confidence]||'#888'}">${p.confidence}</span></div>
    <div class="kv" style="margin-top:6px;font-size:10.5px">출처: ${p.sources}</div>`;
  new maplibregl.Popup({offset:12,closeButton:true,maxWidth:"330px"}).setLngLat(f.geometry.coordinates).setHTML(html).addTo(map);}
function apply(){if(map.getSource("locs"))map.getSource("locs").setData(fdata());refresh();}
function setBase(n){if(n===base)return;base=n;document.getElementById("bm-street").classList.toggle("on",n==="street");document.getElementById("bm-sat").classList.toggle("on",n==="satellite");map.setStyle(STYLES[n]);map.once("idle",()=>{addLayers();refresh();});}
function refresh(){
  const q=(document.getElementById("search").value||"").toLowerCase().trim();
  const b=map.getBounds();let fs=DATA.features.filter(f=>active.has(f.properties.precision));
  if(q)fs=fs.filter(f=>(f.properties.movie+" "+f.properties.real_name+" "+f.properties.resolved_query+" "+f.properties.narrative+" "+f.properties.scene_role).toLowerCase().includes(q));
  else fs=fs.filter(f=>b.contains(f.geometry.coordinates));
  document.getElementById("count").textContent=(q?`검색 "${q}": ${fs.length}`:`화면 안 ${fs.length}`)+` · 전체 ${DATA.features.length}`;
  fs=fs.slice(0,150);
  document.getElementById("list").innerHTML=fs.map(f=>{const p=f.properties;return `
    <div class="card" onclick="fly(${f.geometry.coordinates[0]},${f.geometry.coordinates[1]},${p.id})">
      <div class="ttl"><span class="dot" style="background:${PREC[p.precision][0]}"></span> ${p.real_name}${p.built_set?' <span style="font-size:9px;color:#b07cf5">●세트</span>':''}</div>
      <div class="mv">${p.movie} (${p.year})</div>
      <div class="role"><b>장면</b> ${p.scene_role||p.narrative||"—"}</div>
      <div class="meta">${p.filming_area}, ${p.country} · ${p.lat}, ${p.lng}</div></div>`;}).join("")
    ||`<div style="padding:20px;color:var(--mut);font-size:12px">결과 없음.</div>`;
}
const BYID={};DATA.features.forEach(f=>BYID[f.properties.id]=f);
function fly(lng,lat,id){map.flyTo({center:[lng,lat],zoom:Math.max(map.getZoom(),14)});popup(BYID[id]);}
</script></body></html>
