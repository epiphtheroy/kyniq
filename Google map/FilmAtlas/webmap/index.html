<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Film Spatial Atlas — 영화의 지리</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"/>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root{ --bg:#0e1116; --panel:#161b22; --line:#262d36; --txt:#e6edf3; --mut:#9aa7b4;
         --accent:#f5a623; --setting:#4aa3ff; --production:#f5a623; --festival:#c678dd; --symbolic:#8b98a5; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--txt)}
  #app{display:flex;height:100vh;overflow:hidden}
  #map{flex:1;height:100%}
  #side{width:380px;max-width:42vw;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
  header{padding:14px 16px;border-bottom:1px solid var(--line)}
  header h1{font-size:15px;margin:0 0 3px;letter-spacing:.2px}
  header p{margin:0;font-size:12px;color:var(--mut)}
  #filters{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:11px;padding:4px 9px;border:1px solid var(--line);border-radius:999px;color:var(--mut);cursor:pointer;user-select:none}
  .chip.on{color:#0e1116;background:var(--accent);border-color:var(--accent);font-weight:600}
  #count{padding:8px 16px;font-size:11px;color:var(--mut);border-bottom:1px solid var(--line)}
  #list{flex:1;overflow-y:auto}
  .card{padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer}
  .card:hover{background:#1c232c}
  .card .ttl{font-size:13px;font-weight:600;margin-bottom:2px}
  .card .meta{font-size:11px;color:var(--mut);margin-bottom:6px}
  .card .ex{font-size:12px;color:#c4cdd6;line-height:1.5}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .role-setting{background:var(--setting)} .role-production{background:var(--production)}
  .role-festival{background:var(--festival)} .role-symbolic{background:var(--symbolic)}
  /* reader overlay */
  #reader{position:fixed;top:0;right:-560px;width:540px;max-width:92vw;height:100%;background:var(--panel);
          border-left:1px solid var(--line);box-shadow:-20px 0 50px rgba(0,0,0,.5);transition:right .28s ease;z-index:50;overflow-y:auto}
  #reader.open{right:0}
  #reader .rhead{padding:20px 22px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
  #reader h2{margin:0;font-size:20px} #reader .rsub{color:var(--mut);font-size:12px;margin-top:4px}
  #reader .close{position:absolute;top:16px;right:16px;border:1px solid var(--line);background:none;color:var(--txt);
                 width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px}
  .persp{padding:16px 22px;border-bottom:1px solid var(--line)}
  .persp.active{background:#1b2530}
  .persp h3{margin:0 0 2px;font-size:15px}
  .persp .ph{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px}
  .persp p{margin:0;font-size:13.5px;line-height:1.7;color:#d7dee6}
  .srcs{padding:16px 22px;font-size:12px;color:var(--mut)} .srcs a{color:var(--setting);text-decoration:none}
  .maplibregl-popup{max-width:300px!important}
  .maplibregl-popup-content{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:12px}
  .maplibregl-popup-content .pt{font-weight:600;font-size:13px;margin-bottom:2px}
  .maplibregl-popup-content .pm{color:var(--mut);font-size:11px;margin-bottom:6px}
  .maplibregl-popup-content .pe{line-height:1.5;margin-bottom:9px;color:#c4cdd6}
  .maplibregl-popup-content button{background:var(--accent);color:#0e1116;border:none;border-radius:7px;padding:6px 11px;font-weight:600;cursor:pointer;font-size:12px}
  .maplibregl-popup-tip{border-top-color:var(--line)!important}
  .legend{position:absolute;left:12px;bottom:12px;background:rgba(22,27,34,.92);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:11px;color:var(--mut)}
  .legend b{color:var(--txt);display:block;margin-bottom:5px;font-size:11px}
  .legend span{display:inline-flex;align-items:center;margin-right:10px}
  .basemap{position:absolute;top:12px;right:12px;display:flex;background:rgba(22,27,34,.92);border:1px solid var(--line);border-radius:9px;overflow:hidden;z-index:5}
  .basemap button{border:none;background:none;color:var(--mut);font-size:12px;padding:7px 13px;cursor:pointer}
  .basemap button.on{background:var(--accent);color:#0e1116;font-weight:600}
  @media (max-width:760px){#side{display:none}}
</style>
</head>

<script>
const ARTICLES = {"biutiful": {"title": "Biutiful", "year": 2010, "director": "Alejandro González Iñárritu", "city": "Barcelona, Spain", "perspectives": [{"heading": "The Barcelona Without Postcards", "subheading": "The Anti-Tourist City in Biutiful's Immigrant Neighborhoods", "body": "Alejandro González Iñárritu's Biutiful (2010) performs a deliberate erasure: it sets a story in Barcelona while refusing nearly every image the world associates with the city. There is no Sagrada Família tour, no sunlit Ramblas idyll. Instead Iñárritu filmed in El Raval and La Barceloneta and pushed out to the working-class periphery — Santa Coloma de Gramenet, Badalona, L'Hospitalet de Llobregat — the dense immigrant districts that, as the Barcelona Film Commission puts it, \"never appear in the postcards.\" Uxbal (Javier Bardem) moves through a city of basement workshops, back rooms, and crowded flats. The diegetic Barcelona is the real Barcelona of migrant labor that tourism renders invisible. By choosing these actual neighborhoods, the production stages a counter-map to the global brand built since the 1992 Olympics. Reading the locations, Biutiful becomes an act of urban dissent: it insists that the photogenic capital of design and tourism is also a machine of exploitation, and that the people sustaining its informal economy live in the very streets the marketing crops out. The film restores to the city everything its postcards delete."}, {"heading": "Death in the Sweatshop", "subheading": "Clandestine Chinese Labor in Biutiful's Barcelona Basements", "body": "At Biutiful's horrific center is a basement workshop where Chinese migrants manufacture counterfeit goods and sleep where they work. Uxbal, their black-market middleman, buys them cheap gas heaters to keep them warm; carbon-monoxide poisoning kills more than twenty in a single night. This fiction sits atop a real economy. Barcelona's metropolitan belt, especially Santa Coloma and Badalona, hosts a substantial Chinese community linked to wholesale and counterfeit-goods networks, and clandestine workshops with migrants living on-site are a documented European reality. The mass heater death evokes the genuine hazards of such hidden labor, where people sealed into illegal premises die in fires and gas accidents that surface only as statistics. The diegetic catastrophe dramatizes a structural violence built into the supply chain of cheap goods. Reading this location, Biutiful becomes an indictment of globalized informal production as it touches one Mediterranean city."}, {"heading": "The Street Belongs to No One", "subheading": "African Vendors and Policing in Biutiful's Public Space", "body": "Biutiful's other migrant economy is visible on the pavement: Senegalese street vendors, the manteros, hawking counterfeit bags from sheets they can snatch up and run, scattering when police charge through the plazas and down La Rambla. Iñárritu filmed these chases in Barcelona's real public spaces, depicting a confrontation that genuinely structures the city, where undocumented West African sellers occupy tourist thoroughfares and are periodically swept by police. The diegetic cat-and-mouse mirrors an actual, ongoing struggle over who may use the street and earn from it. Made as a Spanish-Mexican co-production by a Mexican director, the film carries a transnational migrant sensibility into the heart of a European city's contested commons. Reading these locations, Biutiful maps Barcelona as a battleground of belonging."}], "sources": [["Biutiful — Wikipedia", "https://en.wikipedia.org/wiki/Biutiful"], ["Biutiful — Barcelona Film Commission", "https://www.bcncatfilmcommission.com/en/films/biutiful"], ["Biutiful (filming) — IMDb", "https://www.imdb.com/title/tt1164999/locations/"]]}, "importexport": {"title": "Import/Export", "year": 2007, "director": "Ulrich Seidl", "city": "Vienna, Austria ⇄ Ukraine", "perspectives": [{"heading": "Two Directions, One Wound", "subheading": "EU Migration Geography in Import/Export's East–West Axis", "body": "Ulrich Seidl's Import/Export (2007) is built on a single brutal symmetry: Olga, a nurse from Ukraine, travels west to Austria seeking a better life; Pauli, an unemployed Austrian, travels east installing gaming machines. The film was shot along that exact fault line — in Vienna, Ukraine, Slovakia, the Czech Republic, and Romania, between 2005 and May 2007 — the years bracketing the European Union's great eastward enlargement (Slovakia and the Czech Republic joined in 2004, Romania in 2007), with Ukraine left outside the new frontier. The diegetic migration thus traces the EU's real economic gradient: care work and hope flowing one way, cheap goods and desperation the other. Reading the locations, Import/Export becomes a document of the enlarged EU's internal hierarchy, where a continent's borders are also the borders of dignity."}, {"heading": "Real Bodies on the Ward", "subheading": "Documentary Ethics in Import/Export's Vienna Geriatric Ward", "body": "The most unsettling power of Import/Export comes from its refusal to fake. When Olga, the migrant nurse, takes a job cleaning a geriatric ward, Seidl shot those scenes in an actual Vienna hospital — the Lainz geriatric facility — with real, frail elderly patients rather than actors. The unemployment-office sequences likewise used real unemployed people. The diegetic theme — bodies at the bottom of Europe's care economy, the old and the migrant alike treated as surplus — is rendered through the literal presence of those bodies. This documentary-fiction fusion grants the film a devastating authenticity while raising hard ethical questions about consent, dignity, and the camera's claim on dying strangers."}, {"heading": "A Palace of Garbage", "subheading": "Roma Poverty in Import/Export's Slovak Housing Estate", "body": "One of Import/Export's bleakest passages sends Pauli and his stepfather into a decayed socialist-era housing block taken over by Roma families — filmed at a real, notorious estate, the Luník IX settlement on the edge of Košice in Slovakia, where collapsed services left no working plumbing and refuse thrown from windows. The diegetic descent into Europe's most marginalized underclass was staged in the genuine site of that marginalization, among its actual residents. Reading this location exposes the limit of the European project: prosperity's expansion eastward bypassed entire populations, leaving segregated estates as durable as borders."}], "sources": [["Import/Export — Wikipedia", "https://en.wikipedia.org/wiki/Import/Export"], ["Cannes 2007: Import Export — Cinema Scope", "https://cinema-scope.com/cinema-scope-magazine/cannes-2007-import-export-ulrich-seidl-austria/"]]}, "clairesknee": {"title": "Claire's Knee", "year": 1970, "director": "Éric Rohmer", "city": "Lake Annecy, France", "perspectives": [{"heading": "Leisure Has an Owner", "subheading": "Class and Tourism in Claire's Knee's Lake Annecy", "body": "Bourgeois desire needs a backdrop. Rohmer found his on Lake Annecy. Claire's Knee (Le Genou de Claire, 1970), the fifth of Rohmer's Six Moral Tales, sets Jérôme's idle pre-marital summer beside Lac d'Annecy in Haute-Savoie. The diegesis presents the lake as a neutral, sun-warmed idyll for reflection and flirtation. The extradiegetic reality is a specific elite economy: Rohmer shot in Talloires, home to the celebrated Michelin-starred Auberge du Père Bise, and staged scenes around Annecy's Pont des Amours and a private villa in nearby Angon. These are not generic holiday spaces but the haut-bourgeois resort geography of the French Alps, where leisure is a purchased privilege. Reading the location restores the class substrate Rohmer's cool style elides."}, {"heading": "The Cleanest Lake in Europe", "subheading": "Ecology and the Pristine Water of Claire's Knee's Lac d'Annecy", "body": "The water looks eternal. It was, in fact, recently rescued. The shimmering, transparent lake that fills Claire's Knee reads as timeless nature. In truth, Lac d'Annecy had nearly died. Through the 1950s it ranked among Europe's most polluted lakes, its wildlife vanishing under untreated sewage. In July 1957, eight communes formed the SILA syndicate, and by 1967 had ringed the lake with roughly 41 kilometres of interceptor sewer pipe diverting all wastewater beyond its basin — a pioneering civic project that earned Annecy its later title as \"Europe's cleanest lake.\" When Rohmer and cinematographer Néstor Almendros filmed in summer 1970, the luminous purity onscreen was not ancient but barely a decade old, the product of regional environmental politics."}, {"heading": "A Cinema of Small Means", "subheading": "The Losange Economy in Claire's Knee's On-Location Method", "body": "Rohmer filmed light, not sets. His tiny company made that possible. Claire's Knee carries the diary structure of Jérôme's dated July entries, unfolding in real holiday villas under natural daylight. This diegetic intimacy was inseparable from the extradiegetic economy of Les Films du Losange, the micro-company Rohmer co-founded with Barbet Schroeder, which let him work with minimal crews, small budgets, and no studio. Cinematographer Néstor Almendros, shooting available light on actual Annecy locations, made artistic virtue of financial restraint."}], "sources": [["Claire's Knee — Wikipedia", "https://en.wikipedia.org/wiki/Claire's_Knee"], ["Filming Locations — movie-locations.com", "https://movie-locations.com/movies/g/Genou-De-Claire.php"]]}, "godfather2": {"title": "The Godfather Part II", "year": 1974, "director": "Francis Ford Coppola", "city": "Sicily · Santo Domingo · Lake Tahoe", "perspectives": [{"heading": "One Strongman's Island Plays Another", "subheading": "Embargo Geopolitics in The Godfather Part II's Havana", "body": "The 1962 U.S. trade embargo made Batista's Havana unfilmable for an American crew, so Coppola rebuilt Cuba in the Dominican Republic. The film's New Year's Eve 1958 — Hyman Roth and U.S. business interests carving up the island as Castro's rebels close in — was shot in Santo Domingo in 1974. Roth's hotel was the Occidental El Embajador; Batista's palace, where revolution cuts short the festivities, was played by the Dominican Republic's own Presidential Palace. A film about American capital propping up one Caribbean dictator was made under another: the Dominican Republic was then governed by Joaquín Balaguer, a U.S.-aligned strongman. The diegetic Havana was literally produced inside a parallel client state."}, {"heading": "The Village That Exports Its Sons", "subheading": "Emigration Geography in The Godfather Part II's Sicily", "body": "Young Vito Andolini's flight from Corleone — orphaned by a don's vendetta, shipped to New York around 1901 — was filmed not in Corleone but in the hill towns of Savoca and Forza d'Agrò in Sicily's Messina province, the same villages Coppola used for the first film. The actual Corleone, in Palermo province, had modernized, while these stone-built, half-emptied hamlets still embodied the impoverished agrarian Sicily that drove mass emigration. Between roughly 1880 and 1920, millions of southern Italians left for the Americas. Savoca's Bar Vitelli, a real café, anchors the sequence and survives today as a tourist stop."}, {"heading": "The Immigrant Buys the Lake", "subheading": "Assimilation and Capital in The Godfather Part II's Lake Tahoe", "body": "Michael Corleone's fortified compound — site of the First Communion gala, the assassination attempt, and Fredo's death sentence — is Fleur du Lac, a real estate on the western, California shore of Lake Tahoe. Built in 1938 as the summer retreat of industrialist Henry J. Kaiser, the property embodies precisely the American old-money respectability Michael is buying into, having moved the family from immigrant Little Italy to a lakeside seat of ostensibly legitimate wealth. The geography charts assimilation as ascent: from Ellis Island and the tenements of Vito's New York to a gated Sierra Nevada estate beside the Nevada legal-gambling economy."}], "sources": [["The Godfather Part II — Wikipedia", "https://en.wikipedia.org/wiki/The_Godfather_Part_II"], ["Filming locations — movie-locations.com", "https://movie-locations.com/movies/g/Godfather-2.php"]]}, "matchfactorygirl": {"title": "The Match Factory Girl", "year": 1990, "director": "Aki Kaurismäki", "city": "Helsinki & Jyväskylä, Finland", "perspectives": [{"heading": "The Assembly Line Is Real", "subheading": "Industrial Labor in The Match Factory Girl's Finn-Match Plant", "body": "Kaurismäki opens The Match Factory Girl (1990) with several wordless minutes of an actual production line: logs stripped, matches cut, dried, boxed, and labelled by machine. This was no built set. The factory sequences were shot at the Finn-Match plant in Jyväskylä, a working Finnish match manufacturer, with Iris (Kati Outinen) inserted as one more component beside the automated machinery. Finland's match industry, historically a notable export trade, here stands for the dehumanizing tail end of Nordic industrial modernity. By refusing to fake the factory, Kaurismäki lets documentary fact carry his argument."}, {"heading": "A Country on the Brink, on Television", "subheading": "Historical Time in The Match Factory Girl's Helsinki", "body": "Iris's drab Helsinki — a cramped courtyard flat on Toinen linja, a dance hall in Laajasalo, the Hietaniemi cemetery — looks timeless in its grey misery, but Kaurismäki date-stamps it precisely. The television the characters watch broadcasts real news of June 1989: the Tiananmen Square crackdown and the death of Ayatollah Khomeini. This anchors the film's portrait of Finnish working-class stasis to a specific global moment — the last months before the Cold War order dissolved and Finland's Soviet-linked trade economy slid toward the severe recession of the early 1990s."}, {"heading": "Nordic Money for a Small, Hard Film", "subheading": "Co-Production Economics in The Match Factory Girl", "body": "A 68-minute, near-silent film about a humiliated factory worker is no commercial proposition. The Match Factory Girl was a Finnish-Swedish co-production, made by Kaurismäki's own Villealfa Filmproductions together with the Swedish Film Institute (Svenska Filminstitutet). The extradiegetic reality of subsidized Nordic art cinema — pooled Finnish and Swedish institutional money rather than market capital — made possible a film whose entire method is austerity. Completing his Proletariat Trilogy, after Shadows in Paradise and Ariel, Kaurismäki turned economic constraint into a signature style."}], "sources": [["The Match Factory Girl — Wikipedia", "https://en.wikipedia.org/wiki/The_Match_Factory_Girl"], ["The Match Factory Girl — Criterion", "https://www.criterion.com/films/961-the-match-factory-girl"]]}, "anatolia": {"title": "Once Upon a Time in Anatolia", "year": 2011, "director": "Nuri Bilge Ceylan", "city": "Keskin, Kırıkkale, Turkey", "perspectives": [{"heading": "The State Drives Into the Dark", "subheading": "Bureaucracy and Periphery in the film's Keskin", "body": "Once Upon a Time in Anatolia (2011) follows a convoy — a prosecutor, a doctor, police, gendarmes, and a confessed killer — searching the night steppe for a buried corpse near Keskin, a district of Kırıkkale Province in Central Anatolia. The diegesis is, at root, the centralized Turkish state groping through its own rural periphery, and the film was shot precisely there, across eleven weeks in the actual Keskin countryside. The bureaucratic ritual onscreen reflects the real administrative geography of a country governing vast distances from Ankara. The film becomes a map of state power at its frayed edge."}, {"heading": "An Emptiness Full of People Leaving", "subheading": "Depopulation in the film's Steppe", "body": "The film's defining image is the Anatolian steppe at night — endless rolling dark, a few distant lights, a lonely village where the convoy pauses. This emptiness is real terrain around Keskin in Kırıkkale, part of the depopulating agrarian interior of Central Anatolia from which generations have migrated toward Ankara, Istanbul, and abroad. Ceylan does not dress the landscape up; he films its actual scale and silence, letting the steppe's vacancy carry the weight of decline. The spaces look empty because the countryside is, in fact, emptying."}, {"heading": "A Border Drawn in Money", "subheading": "Co-Production Geography of the film", "body": "A nearly three-hour, slow, dialogue-dense Turkish film about a nocturnal body search is a hard commercial sell. Once Upon a Time in Anatolia was produced by Turkey's Zeyno Film in co-production with the Bosnian company Production2006 Sarajevo — a pairing of two countries on Europe's edges. That cross-border backing helped carry the film to the 2011 Cannes Film Festival, where it shared the Grand Prix. An intensely local, nearly untranslatable night in rural Kırıkkale was made possible by transnational regional capital and validated by a French festival."}], "sources": [["Once Upon a Time in Anatolia — Wikipedia", "https://en.wikipedia.org/wiki/Once_Upon_a_Time_in_Anatolia"], ["Bir Zamanlar Anadolu'da — Festival de Cannes", "https://www.festival-cannes.com/en/f/bir-zamanlar-anadolu-da/"]]}};

Time in Anatolia", "year": 2011, "director": "Nuri Bilge Ceylan", "persp": 2, "persp_heading": "A Border Drawn in Money", "persp_subheading": "Co-Production Geography of the film", "excerpt": "A nearly three-hour, slow, dialogue-dense Turkish film about a nocturnal body search is a hard commercial sell. Once Upon a Time in Anatolia was produced by…"}}, {"type": "Feature", "geometry": {"type": "Point", "coordinates": [7.0174, 43.5528]}, "properties": {"id": 44, "place": "Cannes Film Festival", "scale": "poi", "role": "festival", "film_id": "anatolia", "film_title": "Once Upon a Time in Anatolia", "year": 2011, "director": "Nuri Bilge Ceylan", "persp": 2, "persp_heading": "A Border Drawn in Money", "persp_subheading": "Co-Production Geography of the film", "excerpt": "A nearly three-hour, slow, dialogue-dense Turkish film about a nocturnal body search is a hard commercial sell. Once Upon a Time in Anatolia was produced by…"}}]};
const ROLE_LABEL = {setting:"배경(디에게시스)", production:"제작·촬영지", festival:"영화제", symbolic:"상징/부재"};
const ROLE_COLOR = {setting:"#4aa3ff", production:"#f5a623", festival:"#c678dd", symbolic:"#8b98a5"};
let activeRoles = new Set(Object.keys(ROLE_LABEL));

// legend
document.querySelector(".legend").innerHTML = "<b>핀 색상 = 장소 유형</b>" +
  Object.entries(ROLE_LABEL).map(([k,v])=>`<span><i class="dot role-${k}"></i>${v}</span>`).join("");

// filters
const fwrap = document.getElementById("filters");
Object.entries(ROLE_LABEL).forEach(([k,v])=>{
  const c=document.createElement("div"); c.className="chip on"; c.textContent=v; c.dataset.role=k;
  c.onclick=()=>{ c.classList.toggle("on"); c.classList.contains("on")?activeRoles.add(k):activeRoles.delete(k); applyFilter(); };
  fwrap.appendChild(c);
});

// 두 가지 배경: 일반 지도 / 위성사진(Esri 영상 + 지명 라벨 오버레이, 키 불필요)
const STYLES = {
  street: "https://tiles.openfreemap.org/styles/positron",
  satellite: {
    version: 8,
    glyphs: "https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf",
    sources: {
      sat: {type:"raster", tileSize:256, maxzoom:19, attribution:"Imagery © Esri",
        tiles:["https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"]},
      satref: {type:"raster", tileSize:256, maxzoom:19,
        tiles:["https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}"]}
    },
    layers: [
      {id:"sat", type:"raster", source:"sat"},
      {id:"satref", type:"raster", source:"satref", paint:{"raster-opacity":0.9}}
    ]
  }
};
let currentBasemap = "street";

const map = new maplibregl.Map({
  container:"map", style:STYLES.street,
  center:[12,46], zoom:3.2, attributionControl:true
});
map.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-left");

function filteredData(){
  return {type:"FeatureCollection",
    features:DATA.features.filter(f=>activeRoles.has(f.properties.role))};
}

// 핀/클러스터 레이어를 (재)추가 — 배경 스타일이 바뀔 때마다 호출
function addPlaceLayers(){
  if(!map.getSource("places"))
    map.addSource("places",{type:"geojson",data:filteredData(),cluster:true,clusterRadius:46,clusterMaxZoom:11});
  if(!map.getLayer("clusters"))
    map.addLayer({id:"clusters",type:"circle",source:"places",filter:["has","point_count"],
      paint:{"circle-color":"#f5a623",
             "circle-radius":["step",["get","point_count"],16,5,22,12,30],
             "circle-opacity":.9,"circle-stroke-width":2,"circle-stroke-color":"#0e1116"}});
  if(!map.getLayer("cluster-count"))
    map.addLayer({id:"cluster-count",type:"symbol",source:"places",filter:["has","point_count"],
      layout:{"text-field":["get","point_count_abbreviated"],"text-size":12,
              "text-font":["Noto Sans Regular"]},paint:{"text-color":"#0e1116"}});
  if(!map.getLayer("pts"))
    map.addLayer({id:"pts",type:"circle",source:"places",filter:["!",["has","point_count"]],
      paint:{"circle-radius":7,
        "circle-color":["match",["get","role"],
          "setting","#4aa3ff","production","#f5a623","festival","#c678dd","symbolic","#d0d8e0","#4aa3ff"],
        "circle-stroke-width":2,"circle-stroke-color":"#0e1116"}});
}

// 레이어별 이벤트는 한 번만 바인딩 (스타일 교체 후에도 유지됨)
map.on("click","clusters",(e)=>{
  const f=map.queryRenderedFeatures(e.point,{layers:["clusters"]})[0];
  map.getSource("places").getClusterExpansionZoom(f.properties.cluster_id).then(z=>
    map.easeTo({center:f.geometry.coordinates,zoom:z}));
});
map.on("click","pts",(e)=>openPopup(e.features[0]));
map.on("mouseenter","pts",()=>map.getCanvas().style.cursor="pointer");
map.on("mouseleave","pts",()=>map.getCanvas().style.cursor="");
map.on("mouseenter","clusters",()=>map.getCanvas().style.cursor="pointer");
map.on("mouseleave","clusters",()=>map.getCanvas().style.cursor="");
map.on("moveend",refreshList);

map.on("load", ()=>{ addPlaceLayers(); refreshList(); });

function setBasemap(name){
  if(name===currentBasemap) return;
  currentBasemap = name;
  document.getElementById("bm-street").classList.toggle("on", name==="street");
  document.getElementById("bm-sat").classList.toggle("on", name==="satellite");
  map.setStyle(STYLES[name]);
  map.once("idle", ()=>{ addPlaceLayers(); refreshList(); });  // 새 스타일 위에 핀 다시 얹기
}

function openPopup(f){
  const p=f.properties;
  const html=`<div class="pt">${p.place}</div>
    <div class="pm">${p.film_title} (${p.year}) · ${ROLE_LABEL[p.role]}</div>
    <div class="pe">${p.excerpt}</div>
    <button onclick="openReader('${p.film_id}',${p.persp})">전체 읽기 →</button>`;
  new maplibregl.Popup({offset:14,closeButton:false}).setLngLat(f.geometry.coordinates).setHTML(html).addTo(map);
}

function applyFilter(){ if(map.getSource("places")) map.getSource("places").setData(filteredData()); refreshList(); }

function refreshList(){
  const list=document.getElementById("list"); const b=map.getBounds();
  const inView=DATA.features.filter(f=>activeRoles.has(f.properties.role) &&
    b.contains(f.geometry.coordinates));
  document.getElementById("count").textContent =
    `이 화면 안: 장소 ${inView.length}곳 · 영화 ${new Set(inView.map(f=>f.properties.film_id)).size}편`;
  inView.sort((a,c)=>a.properties.film_title.localeCompare(c.properties.film_title));
  list.innerHTML = inView.map(f=>{const p=f.properties;return `
    <div class="card" onclick="flyTo(${f.geometry.coordinates[0]},${f.geometry.coordinates[1]},'${p.film_id}',${p.persp})">
      <div class="ttl"><span class="dot role-${p.role}"></span>${p.place}</div>
      <div class="meta">${p.film_title} (${p.year}) · ${p.director}</div>
      <div class="ex">${p.excerpt}</div>
    </div>`;}).join("") || `<div style="padding:20px;color:var(--mut);font-size:12px">이 영역엔 표시할 장소가 없습니다. 지도를 축소하거나 이동해 보세요.</div>`;
}

function flyTo(lon,lat,film,persp){ map.flyTo({center:[lon,lat],zoom:Math.max(map.getZoom(),9)}); openReader(film,persp); }

function openReader(film,persp){
  const a=ARTICLES[film]; const rb=document.getElementById("rbody");
  rb.innerHTML = `<div class="rhead"><h2>${a.title}</h2>
      <div class="rsub">${a.year} · ${a.director} · ${a.city}</div></div>` +
    a.perspectives.map((pp,i)=>`<div class="persp ${i===persp?'active':''}">
        <div class="ph">Perspective ${i+1}</div>
        <h3>${pp.heading}</h3>
        <div class="rsub" style="margin:2px 0 9px">${pp.subheading}</div>
        <p>${pp.body}</p></div>`).join("") +
    `<div class="srcs"><b style="color:var(--txt)">Sources</b><br>${
        a.sources.map(s=>`· <a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a>`).join("<br>")}</div>`;
  document.getElementById("reader").classList.add("open");
  const act=rb.querySelector(".persp.active"); if(act) act.scrollIntoView({block:"center"});
}
function closeReader(){ document.getElementById("reader").classList.remove("open"); }
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeReader(); });
</script>
</body>
</html>
