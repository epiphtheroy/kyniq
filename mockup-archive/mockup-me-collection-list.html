<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MetaTake · 내가 본 영화 리스트 (시안)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css">
<style>
  :root{
    --bg:#0B0B0C;--pnl:#141416;--pnl2:#1A1A1E;--line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.15);
    --ink:#ECEAE5;--mut:#9A968D;--sub:#6C6960;--red:#E3120B;
    --canon:#C8922B;--award:#E3120B;--national:#3E8FE0;--movement:#1FB286;--auteur:#9B8CF0;--good:#1FB286;
    --ser:"PT Serif",Georgia,serif;--ui:"Inter",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}.ser{font-family:var(--ser)}
  .eb{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--sub)}
  .wrap{max-width:1500px;margin:0 auto;padding:14px 18px 60px}
  .topbar{display:flex;align-items:center;gap:14px;padding:10px 4px 12px;border-bottom:1px solid var(--line2)}
  .logo{background:var(--red);color:#fff;font-weight:600;font-size:12px;letter-spacing:.12em;padding:3px 7px}
  .tabs{display:flex;gap:5px;margin-left:auto;font-size:12px}
  .tabs span{padding:5px 10px;border:1px solid var(--line2);color:var(--mut);border-radius:2px}
  .tabs span.on{background:var(--ink);color:#0B0B0C;border-color:var(--ink)}

  .layout{display:grid;grid-template-columns:248px 1fr;gap:14px;margin-top:13px}
  /* sidebar */
  .side{align-self:start;position:sticky;top:10px}
  .fgrp{background:var(--pnl);border:1px solid var(--line);border-radius:3px;padding:11px 12px;margin-bottom:10px}
  .fgrp h4{margin:0 0 9px;font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--ink);display:flex;align-items:center;gap:6px}
  .slideval{font-family:var(--mono);color:var(--red);font-size:12px;margin-left:auto}
  input[type=range]{width:100%;accent-color:var(--red);height:4px}
  .opt{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;font-size:12.5px;color:var(--mut)}
  .opt:hover{color:var(--ink)}
  .opt .bx{width:14px;height:14px;border:1px solid var(--line2);border-radius:2px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:10px}
  .opt.on .bx{background:var(--red);border-color:var(--red);color:#fff}
  .opt.on{color:var(--ink)}
  .opt .ct{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--sub)}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{font-size:11px;padding:3px 8px;border:1px solid var(--line2);border-radius:13px;color:var(--mut);cursor:pointer}
  .chip.on{background:var(--ink);color:#0B0B0C;border-color:var(--ink)}

  /* results header */
  .rhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .rhead .cnt{font-family:var(--ser);font-size:17px}.rhead .cnt b{color:var(--red)}
  .sortsel{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut)}
  select{background:var(--pnl2);color:var(--ink);border:1px solid var(--line2);border-radius:3px;padding:5px 8px;font-family:var(--ui);font-size:12px}
  .actchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px;min-height:4px}
  .ac{font-size:11px;background:var(--pnl2);border:1px solid var(--line2);border-radius:13px;padding:3px 9px;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:5px}
  .ac i{color:var(--sub)}

  /* listing card (car-style) */
  .lst{display:flex;flex-direction:column;gap:9px}
  .row{display:grid;grid-template-columns:64px 1fr 158px;gap:13px;background:var(--pnl);border:1px solid var(--line);border-radius:4px;padding:11px 12px;transition:border-color .15s}
  .row:hover{border-color:var(--line2)}
  .po{width:64px;height:92px;border-radius:2px;background:linear-gradient(150deg,#2a2a30,#161618);display:flex;align-items:flex-end;justify-content:center;position:relative;overflow:hidden}
  .po .yr{font-family:var(--mono);font-size:10px;color:var(--sub);padding-bottom:5px}
  .po .flag{position:absolute;top:5px;left:5px;font-size:9px;font-family:var(--mono);color:var(--ink);background:rgba(0,0,0,.5);padding:0 4px;border-radius:2px}
  .info .tt{font-family:var(--ser);font-size:17px;line-height:1.2}
  .info .dr{font-size:11.5px;color:var(--mut);margin-top:2px}
  .info .dr .g{font-family:var(--mono);font-size:9px;color:var(--canon);border:1px solid #5b481f;border-radius:2px;padding:0 4px;margin-left:5px}
  .bds{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
  .bd{font-size:9.5px;font-family:var(--mono);padding:2px 6px;border-radius:2px;border:1px solid var(--line);color:var(--mut);display:flex;align-items:center;gap:4px}
  .bd.canon{color:#e6c884;border-color:#5b481f;background:#1c1708}.bd.award{color:#f2b3b0;border-color:#7a1410;background:#220a08}
  .bd.national{color:#9cc8f3;border-color:#234a72}.bd.movement{color:#8ee3cc;border-color:#1d5145}
  .bd.reading{color:#c6bcf7;border-color:#463c84}.bd.trope{color:var(--mut)}
  .bd.depth{color:#f2b3b0;border-color:#7a1410}
  .spec{font-size:11px;color:var(--sub);margin-top:7px;display:flex;gap:12px;flex-wrap:wrap}
  .spec b{color:var(--mut);font-weight:400}

  /* price block */
  .price{border-left:1px solid var(--line);padding-left:13px;display:flex;flex-direction:column;align-items:flex-end}
  .price .pl{font-size:9px;letter-spacing:.1em;color:var(--sub)}
  .price .pv{font-family:var(--mono);font-size:30px;line-height:1;color:var(--ink)}
  .price .sub{display:flex;gap:8px;margin-top:6px;font-size:9.5px;color:var(--sub);font-family:var(--mono)}
  .price .sub b{color:var(--canon)}.price .sub .d{color:var(--movement)}
  .stars{margin-top:8px;font-size:13px;color:var(--canon);letter-spacing:1px}
  .stars .me{font-family:var(--mono);font-size:11px;color:var(--mut);margin-left:3px}
  .val{margin-top:7px;font-size:10px;font-weight:600;padding:2px 7px;border-radius:2px}
  .val.find{background:#0e211c;color:#8ee3cc;border:1px solid #1d5145}
  .val.fit{background:var(--pnl2);color:var(--mut);border:1px solid var(--line2)}
  .val.over{background:#220a08;color:#f2b3b0;border:1px solid #7a1410}
  .meta{margin-top:8px;font-size:10px;color:var(--sub);text-align:right;font-family:var(--mono)}
  .empty{text-align:center;color:var(--sub);padding:40px;font-style:italic}
  @media(max-width:960px){.layout{grid-template-columns:1fr}.side{position:static}.row{grid-template-columns:54px 1fr}.price{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);padding-left:0;padding-top:9px;align-items:flex-start;flex-direction:row;gap:16px;flex-wrap:wrap}}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <span class="logo">META TAKE</span>
    <span class="ser" style="font-size:18px;font-weight:700">내가 본 영화 · 보유 자산 리스트</span>
    <span class="eb" style="margin-left:6px"><i class="ti ti-lock"></i> 비공개 · wonwoo</span>
    <div class="tabs"><span>기록</span><span class="on">내 자산</span><span>볼 영화</span><span>서재</span><span>노트</span><span>동행</span><span>공개 ↗</span></div>
  </div>

  <div class="layout">

    <!-- SIDEBAR FILTERS -->
    <aside class="side">
      <div class="fgrp">
        <h4><i class="ti ti-coin"></i> 정전가(점수) ≥ <span class="slideval" id="scoreOut">0</span></h4>
        <input type="range" id="scoreMin" min="0" max="95" step="1" value="0">
        <h4 style="margin-top:13px"><i class="ti ti-star"></i> 내 별점 ≥ <span class="slideval" id="rateOut">0.0</span></h4>
        <input type="range" id="rateMin" min="0" max="9.5" step="0.5" value="0">
      </div>

      <div class="fgrp"><h4><i class="ti ti-diamonds"></i> 가치 평가</h4><div id="fVal" class="chips"></div></div>
      <div class="fgrp"><h4><i class="ti ti-calendar"></i> 연대</h4><div id="fDecade"></div></div>
      <div class="fgrp"><h4><i class="ti ti-world"></i> 국가</h4><div id="fCountry"></div></div>
      <div class="fgrp"><h4><i class="ti ti-user-star"></i> 감독 등급</h4><div id="fGtier" class="chips"></div></div>
      <div class="fgrp"><h4><i class="ti ti-award"></i> 리니지 · 정전</h4><div id="fLin"></div></div>
      <div class="fgrp"><h4><i class="ti ti-stairs-down"></i> 깊이 · 가용</h4><div id="fDepth"></div></div>
    </aside>

    <!-- RESULTS -->
    <main>
      <div class="rhead">
        <div class="cnt"><b id="rcount">15</b>편 보유 · 평균 정전가 <span class="mono" id="ravg">—</span></div>
        <div class="sortsel"><i class="ti ti-arrows-sort"></i> 정렬
          <select id="sort">
            <option value="score">정전가 높은순</option>
            <option value="value">저평가 발굴순</option>
            <option value="rating">내 별점순</option>
            <option value="recent">최근 관람순</option>
            <option value="discovery">발굴 점수순</option>
            <option value="year">최신 연도순</option>
            <option value="scoreAsc">정전가 낮은순</option>
          </select>
        </div>
      </div>
      <div class="actchips" id="actchips"></div>
      <div class="lst" id="list"></div>
    </main>
  </div>

  <p style="text-align:center;margin-top:18px;font-size:10.5px;color:var(--sub);font-style:italic">보유 영화를 가격(점수) 매겨진 자산처럼 — 중고차 리스트식 필터·정렬·뱃지 · 정전가 vs 내 별점으로 가치 판정 · 표시 수치는 예시 포트폴리오(wonwoo)</p>
</div>

<script>
const G={bresson:'G1',dardenne:'G1',tarr:'G1',ozu:'G1',bong:'G1',bergman:'G1',yang:'G1',wong:'G1',
 park:'G2',lee:'G2',reich:'G2',mungiu:'G2',farhadi:'G2',hama:'G3'};
const DN={bresson:"브레송",dardenne:"다르덴",tarr:"벨라 타르",ozu:"오즈",bong:"봉준호",bergman:"베리만",yang:"에드워드 양",
 wong:"왕가위",park:"박찬욱",lee:"이창동",reich:"라이카트",mungiu:"문지우",farhadi:"파라디",hama:"하마구치"};
const CON={FR:"프랑스",KR:"한국",JP:"일본",HU:"헝가리",US:"미국",TW:"대만",SE:"스웨덴",BE:"벨기에",HK:"홍콩",RO:"루마니아",IR:"이란"};
const LIN={
 palme:["칸 황금종려",'award'],'oscar-bp':["오스카 작품상",'award'],'oscar-intl':["오스카 국제장편",'award'],
 'cannes-gp':["칸 그랑프리",'award'],'cannes-comp':["칸 경쟁",'award'],berlin:["베를린 황금곰",'award'],
 'golden-horse':["금마장",'national'],kinema:["키네마준보",'national'],
 sands:["S&S 2022",'canon'],tspdt:["TSPDT",'canon'],bbc21:["BBC 21c",'canon'],
 'french-spiritual':["프랑스 영성",'movement'],slow:["슬로우 시네마",'movement'],'new-korean':["뉴 코리안",'movement'],
 'romanian-nw':["루마니아 뉴웨이브",'movement'],iranian:["이란 뉴웨이브",'movement']};
const TR={witness:"무력한 목격자",guilt:"전이된 죄",landscape:"풍경의 무관심",class:"계급의 유령",double:"이중 자아",
 vanish:"사라진 여자",intruder:"침입자",friendship:"연약한 우정",distance:"세대의 거리",time:"무심한 시간",
 language:"말의 수행",mask:"가면",longing:"갈망의 지연",truth:"은폐된 진실",repetition:"종말의 반복"};
const RD={ethics:"윤리",psy:"정신분석",ontology:"존재론",politics:"정치",semiotics:"기호학"};
const SVC={Criterion:"Criterion",MUBI:"MUBI",Netflix:"Netflix",Prime:"Prime"};
const FCOL={award:'#E3120B',canon:'#C8922B',national:'#3E8FE0',movement:'#1FB286'};

const FILMS=[
 {id:'balthazar',t:"Au Hasard Balthazar",y:1966,co:'FR',d:'bresson',pr:84,dc:30,sc:86,rt:9.4,wd:'2024-03',vn:'theater',rw:2,wrote:1,read:1,av:'Criterion',lin:[['tspdt',16],['sands'],['french-spiritual']],tr:['witness','guilt'],rd:['ethics','ontology']},
 {id:'mouchette',t:"Mouchette",y:1967,co:'FR',d:'bresson',pr:72,dc:28,sc:74,rt:8.8,wd:'2024-04',vn:'streaming',rw:0,wrote:0,read:1,av:'Criterion',lin:[['tspdt',183],['french-spiritual']],tr:['witness','guilt'],rd:['ethics','psy']},
 {id:'turin',t:"The Turin Horse",y:2011,co:'HU',d:'tarr',pr:78,dc:40,sc:82,rt:9.0,wd:'2023-11',vn:'theater',rw:0,wrote:0,read:1,av:'MUBI',lin:[['berlin'],['slow'],['tspdt',420]],tr:['landscape','repetition'],rd:['ontology']},
 {id:'tokyo',t:"Tokyo Story",y:1953,co:'JP',d:'ozu',pr:88,dc:22,sc:89,rt:9.6,wd:'2023-08',vn:'physical',rw:1,wrote:1,read:1,av:'Criterion',lin:[['sands',4],['tspdt',3],['kinema']],tr:['distance','time'],rd:['ethics']},
 {id:'burning',t:"Burning",y:2018,co:'KR',d:'lee',pr:70,dc:35,sc:73,rt:8.2,wd:'2024-01',vn:'streaming',rw:0,wrote:0,read:0,av:'Netflix',lin:[['cannes-comp'],['new-korean']],tr:['class','vanish'],rd:['psy','politics']},
 {id:'oldboy',t:"Oldboy",y:2003,co:'KR',d:'park',pr:74,dc:30,sc:76,rt:8.5,wd:'2022-12',vn:'streaming',rw:1,wrote:0,read:1,av:'Prime',lin:[['cannes-gp'],['new-korean']],tr:['guilt','double'],rd:['psy']},
 {id:'drive',t:"Drive My Car",y:2021,co:'JP',d:'hama',pr:80,dc:28,sc:82,rt:8.0,wd:'2023-02',vn:'theater',rw:0,wrote:0,read:1,av:'MUBI',lin:[['oscar-intl'],['cannes-comp']],tr:['guilt','language'],rd:['psy','ethics']},
 {id:'parasite',t:"Parasite",y:2019,co:'KR',d:'bong',pr:92,dc:25,sc:93,rt:8.4,wd:'2019-06',vn:'theater',rw:1,wrote:1,read:1,av:'Netflix',lin:[['palme'],['oscar-bp'],['new-korean']],tr:['class','intruder'],rd:['politics']},
 {id:'firstcow',t:"First Cow",y:2019,co:'US',d:'reich',pr:62,dc:38,sc:67,rt:9.1,wd:'2024-05',vn:'streaming',rw:0,wrote:0,read:1,av:'MUBI',lin:[['slow']],tr:['landscape','friendship'],rd:['ethics']},
 {id:'brighter',t:"A Brighter Summer Day",y:1991,co:'TW',d:'yang',pr:85,dc:40,sc:88,rt:9.2,wd:'2023-06',vn:'physical',rw:0,wrote:0,read:0,av:'Criterion',lin:[['golden-horse'],['tspdt',97]],tr:['class','double'],rd:['politics']},
 {id:'persona',t:"Persona",y:1966,co:'SE',d:'bergman',pr:86,dc:30,sc:87,rt:8.7,wd:'2022-09',vn:'streaming',rw:0,wrote:0,read:1,av:'Criterion',lin:[['sands',23],['tspdt',20]],tr:['double','mask'],rd:['psy','ontology']},
 {id:'lefils',t:"Le Fils",y:2002,co:'BE',d:'dardenne',pr:66,dc:32,sc:70,rt:8.9,wd:'2024-02',vn:'streaming',rw:0,wrote:0,read:1,av:'MUBI',lin:[['cannes-comp']],tr:['guilt','witness'],rd:['ethics']},
 {id:'mood',t:"In the Mood for Love",y:2000,co:'HK',d:'wong',pr:90,dc:28,sc:91,rt:9.5,wd:'2023-03',vn:'theater',rw:2,wrote:1,read:1,av:'Criterion',lin:[['sands',5],['tspdt',24],['bbc21',2]],tr:['longing','time'],rd:['semiotics']},
 {id:'fourmonths',t:"4 Months, 3 Weeks and 2 Days",y:2007,co:'RO',d:'mungiu',pr:76,dc:45,sc:81,rt:8.6,wd:'2024-04',vn:'streaming',rw:0,wrote:0,read:0,av:'MUBI',lin:[['palme'],['romanian-nw']],tr:['class','truth'],rd:['politics','ethics']},
 {id:'separation',t:"A Separation",y:2011,co:'IR',d:'farhadi',pr:82,dc:38,sc:85,rt:9.0,wd:'2023-10',vn:'streaming',rw:0,wrote:0,read:0,av:'Prime',lin:[['berlin'],['oscar-intl'],['iranian']],tr:['guilt','truth'],rd:['ethics']},
];
function decadeOf(y){return Math.floor(y/10)*10;}
function valClass(f){const gap=f.rt*10-f.pr; if(gap>=12)return'find'; if(gap<=-9)return'over'; return'fit';}
const VALN={find:"저평가 발굴",fit:"정전 합치",over:"고평가 실망"};

let st={scoreMin:0,rateMin:0,vals:new Set(),decades:new Set(),cos:new Set(),gt:new Set(),lins:new Set(),depth:new Set(),sort:'score'};

function pass(f){
 if(f.sc<st.scoreMin)return false;
 if(f.rt<st.rateMin)return false;
 if(st.vals.size&&!st.vals.has(valClass(f)))return false;
 if(st.decades.size&&!st.decades.has(decadeOf(f.y)))return false;
 if(st.cos.size&&!st.cos.has(f.co))return false;
 if(st.gt.size&&!st.gt.has(G[f.d]))return false;
 if(st.lins.size&&!f.lin.some(l=>st.lins.has(l[0])))return false;
 if(st.depth.has('wrote')&&!f.wrote)return false;
 if(st.depth.has('read')&&!f.read)return false;
 if(st.depth.has('rewatch')&&!f.rw)return false;
 for(const s of st.depth) if(s.startsWith('av:')&&f.av!==s.slice(3))return false;
 return true;
}
function sortFn(a,b){switch(st.sort){
 case'value':return (b.rt*10-b.pr)-(a.rt*10-a.pr);
 case'rating':return b.rt-a.rt;
 case'recent':return b.wd<a.wd?-1:1;
 case'discovery':return b.dc-a.dc;
 case'year':return b.y-a.y;
 case'scoreAsc':return a.sc-b.sc;
 default:return b.sc-a.sc;}}

function countBy(fn){const m={};FILMS.forEach(f=>{const k=fn(f);(Array.isArray(k)?k:[k]).forEach(x=>m[x]=(m[x]||0)+1);});return m;}

function optRow(label,count,on){return `<span class="bx">${on?'<i class="ti ti-check"></i>':''}</span><span>${label}</span><span class="ct">${count}</span>`;}

function renderFacets(){
 // value chips
 const vm=countBy(f=>valClass(f));
 document.getElementById('fVal').innerHTML=['find','fit','over'].map(v=>
   `<span class="chip ${st.vals.has(v)?'on':''}" data-g="vals" data-k="${v}">${VALN[v]} ${vm[v]||0}</span>`).join('');
 // decades
 const dm=countBy(f=>decadeOf(f.y));
 document.getElementById('fDecade').innerHTML=Object.keys(dm).sort((a,b)=>b-a).map(d=>
   `<div class="opt ${st.decades.has(+d)?'on':''}" data-g="decades" data-k="${d}" data-num="1">${optRow(d.slice(0,4)+'년대',dm[d],st.decades.has(+d))}</div>`).join('');
 // country
 const cm=countBy(f=>f.co);
 document.getElementById('fCountry').innerHTML=Object.entries(cm).sort((a,b)=>b[1]-a[1]).map(([c,n])=>
   `<div class="opt ${st.cos.has(c)?'on':''}" data-g="cos" data-k="${c}">${optRow(CON[c],n,st.cos.has(c))}</div>`).join('');
 // gtier
 const gm=countBy(f=>G[f.d]);
 document.getElementById('fGtier').innerHTML=['G1','G2','G3','G4','G5'].filter(g=>gm[g]).map(g=>
   `<span class="chip ${st.gt.has(g)?'on':''}" data-g="gt" data-k="${g}">${g} ${gm[g]}</span>`).join('');
 // lineage
 const lm=countBy(f=>f.lin.map(l=>l[0]));
 const order=['canon','award','national','movement'];
 document.getElementById('fLin').innerHTML=Object.keys(lm).sort((a,b)=>order.indexOf(LIN[a][1])-order.indexOf(LIN[b][1])||lm[b]-lm[a]).map(k=>
   `<div class="opt ${st.lins.has(k)?'on':''}" data-g="lins" data-k="${k}">${optRow(`<span style="color:${FCOL[LIN[k][1]]}">●</span> ${LIN[k][0]}`,lm[k],st.lins.has(k))}</div>`).join('');
 // depth + availability
 const wrote=FILMS.filter(f=>f.wrote).length,read=FILMS.filter(f=>f.read).length,rew=FILMS.filter(f=>f.rw).length;
 const am=countBy(f=>'av:'+f.av);
 let dh=`<div class="opt ${st.depth.has('wrote')?'on':''}" data-g="depth" data-k="wrote">${optRow('내 오독 작성',wrote,st.depth.has('wrote'))}</div>
  <div class="opt ${st.depth.has('read')?'on':''}" data-g="depth" data-k="read">${optRow('오독 읽음',read,st.depth.has('read'))}</div>
  <div class="opt ${st.depth.has('rewatch')?'on':''}" data-g="depth" data-k="rewatch">${optRow('다시 본 작품',rew,st.depth.has('rewatch'))}</div>`;
 dh+=Object.keys(am).sort((a,b)=>am[b]-am[a]).map(k=>
   `<div class="opt ${st.depth.has(k)?'on':''}" data-g="depth" data-k="${k}">${optRow('▸ '+SVC[k.slice(3)],am[k],st.depth.has(k))}</div>`).join('');
 document.getElementById('fDepth').innerHTML=dh;

 document.querySelectorAll('[data-g]').forEach(el=>el.onclick=()=>{
   const g=el.dataset.g,k=el.dataset.num?+el.dataset.k:el.dataset.k;
   const set=st[g];set.has(k)?set.delete(k):set.add(k);renderAll();});
}
function stars(rt){const full=Math.round(rt/2);let s='';for(let i=0;i<5;i++)s+=i<full?'★':'☆';return s;}
function renderList(){
 const out=FILMS.filter(pass).sort(sortFn);
 document.getElementById('rcount').textContent=out.length;
 document.getElementById('ravg').textContent=out.length?Math.round(out.reduce((s,f)=>s+f.sc,0)/out.length):'—';
 const L=document.getElementById('list');
 if(!out.length){L.innerHTML='<div class="empty">조건에 맞는 보유 영화가 없습니다 · 필터를 완화하세요.</div>';return;}
 L.innerHTML=out.map(f=>{
   const vc=valClass(f);
   const linb=f.lin.map(l=>{const[k,r]=l;const fc=LIN[k][1];return `<span class="bd ${fc}">${LIN[k][0]}${r?' #'+r:''}</span>`;}).join('');
   const trb=f.tr.slice(0,2).map(k=>`<span class="bd trope">「${TR[k]}」</span>`).join('');
   const rdb=f.rd.slice(0,1).map(k=>`<span class="bd reading">${RD[k]}</span>`).join('');
   const dep=f.wrote?'<span class="bd depth"><i class="ti ti-pencil"></i>내 오독</span>':'';
   const vn={theater:'극장',streaming:'스트리밍',physical:'블루레이',festival:'영화제'}[f.vn];
   return `<div class="row">
     <div class="po"><span class="flag">${f.co}</span><span class="yr">${f.y}</span></div>
     <div class="info">
       <div class="tt">${f.t}</div>
       <div class="dr">${DN[f.d]}<span class="g">${G[f.d]}</span> · ${CON[f.co]}</div>
       <div class="bds">${linb}${rdb}${trb}${dep}</div>
       <div class="spec"><span><b>관람</b> ${f.wd.replace('-','.')}</span><span><b>관람처</b> ${vn}</span>${f.rw?`<span><b>다시보기</b> ${f.rw}회</span>`:''}<span><b>가용</b> ${SVC[f.av]}</span></div>
     </div>
     <div class="price">
       <div class="pl">정전가</div><div class="pv">${f.sc}</div>
       <div class="sub"><span>P <b>${f.pr}</b></span><span class="d">D ${f.dc}</span></div>
       <div class="stars">${stars(f.rt)}<span class="me">${f.rt.toFixed(1)}</span></div>
       <div class="val ${vc}">${VALN[vc]}</div>
     </div>
   </div>`;}).join('');
}
function renderChips(){
 const c=[];
 if(st.scoreMin>0)c.push(['scoreMin','정전가 ≥ '+st.scoreMin]);
 if(st.rateMin>0)c.push(['rateMin','별점 ≥ '+st.rateMin.toFixed(1)]);
 st.vals.forEach(v=>c.push(['vals:'+v,VALN[v]]));
 st.decades.forEach(d=>c.push(['decades:'+d,d+'년대']));
 st.cos.forEach(x=>c.push(['cos:'+x,CON[x]]));
 st.gt.forEach(x=>c.push(['gt:'+x,x]));
 st.lins.forEach(x=>c.push(['lins:'+x,LIN[x][0]]));
 st.depth.forEach(x=>c.push(['depth:'+x, x.startsWith('av:')?SVC[x.slice(3)]:({wrote:'내 오독',read:'오독 읽음',rewatch:'다시 본'}[x])]));
 const box=document.getElementById('actchips');
 box.innerHTML=c.length?c.map(([id,l])=>`<span class="ac" data-id="${id}">${l} <i class="ti ti-x"></i></span>`).join('')+`<span class="ac" data-id="__all" style="color:var(--red)">전체 해제</span>`:'';
 box.querySelectorAll('.ac').forEach(el=>el.onclick=()=>{
   const id=el.dataset.id;
   if(id==='__all'){st={scoreMin:0,rateMin:0,vals:new Set(),decades:new Set(),cos:new Set(),gt:new Set(),lins:new Set(),depth:new Set(),sort:st.sort};
     document.getElementById('scoreMin').value=0;document.getElementById('rateMin').value=0;
     document.getElementById('scoreOut').textContent='0';document.getElementById('rateOut').textContent='0.0';renderAll();return;}
   if(id==='scoreMin'){st.scoreMin=0;document.getElementById('scoreMin').value=0;document.getElementById('scoreOut').textContent='0';}
   else if(id==='rateMin'){st.rateMin=0;document.getElementById('rateMin').value=0;document.getElementById('rateOut').textContent='0.0';}
   else{const[g,k]=id.split(/:(.+)/);st[g].delete(g==='decades'?+k:k);}
   renderAll();});
}
function renderAll(){renderFacets();renderList();renderChips();}
document.getElementById('scoreMin').oninput=e=>{st.scoreMin=+e.target.value;document.getElementById('scoreOut').textContent=e.target.value;renderAll();};
document.getElementById('rateMin').oninput=e=>{st.rateMin=+e.target.value;document.getElementById('rateOut').textContent=(+e.target.value).toFixed(1);renderAll();};
document.getElementById('sort').onchange=e=>{st.sort=e.target.value;renderList();};
renderAll();
</script>
</body>
</html>
