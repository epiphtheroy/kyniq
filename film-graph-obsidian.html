<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metatake — Film graph (Obsidian-style)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0c10;--ink:#e9e4d8;--ink2:#9aa0a8;--ink3:#5b6068;--line:rgba(233,228,216,.12);
  --film:#e8e2d4;--figure:#c9b79a;--reading:#e0a34a;--trope:#4fb6ad;--accent:#f0b65f;
  --ui:'Inter',system-ui,sans-serif;--serif:'Fraunces',Georgia,serif;
}
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;background:radial-gradient(120% 100% at 50% 35%,#101117,#080809);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;z-index:10}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font:600 15px/1 var(--ui);letter-spacing:.16em}
.brand span{font:400 12px/1 var(--ui);color:var(--ink2)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools input{height:34px;width:210px;background:#15161c;border:1px solid var(--line);border-radius:9px;color:var(--ink);padding:0 12px 0 30px;font:400 13px var(--ui);outline:none}
.tools input:focus{border-color:var(--accent)}
.search{position:relative}.search .m{position:absolute;left:10px;top:8px;color:var(--ink3)}
.btn{height:34px;background:#15161c;border:1px solid var(--line);border-radius:9px;color:var(--ink);padding:0 13px;font:500 12px/1 var(--ui);cursor:pointer;transition:.18s}
.btn:hover{border-color:var(--accent);color:var(--accent)}

.stage{position:relative;flex:1;overflow:hidden;cursor:grab}
.stage.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#lines{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.gnode{position:absolute;transform:translate(-50%,-50%);cursor:pointer;transition:opacity .25s}
.gnode .dot{border-radius:50%;margin:0 auto;transition:box-shadow .2s,transform .2s,background .2s}
.gnode:hover .dot{transform:scale(1.18)}
.gnode .lbl{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:5px;white-space:nowrap;
  font:500 12px/1.1 var(--ui);text-shadow:0 1px 4px rgba(0,0,0,.95),0 0 2px rgba(0,0,0,.8);transition:color .2s,opacity .2s}
.gnode.dim{opacity:.12}
.gnode.film .dot{background:var(--film)}
.gnode.film .lbl{color:var(--film)}
.gnode.center .dot{background:var(--accent);box-shadow:0 0 0 4px rgba(240,182,95,.16),0 0 26px rgba(240,182,95,.4)}
.gnode.center .lbl{color:#fff;font:500 15px/1.1 var(--serif)}
.gnode.figure .dot{background:var(--figure)}
.gnode.figure .lbl{color:var(--figure)}
.gnode.reading .dot{background:var(--reading)}
.gnode.reading .lbl{color:#e7b56e}
.gnode.trope .dot{background:var(--trope)}
.gnode.trope .lbl{color:#79d2c9}
.gnode.leaf .lbl{color:var(--ink2);font-weight:400}
.gnode.leaf.seed .dot{box-shadow:0 0 0 3px rgba(240,182,95,.25)}
.gnode.leaf.seed .lbl{color:#cdb892}
.gnode.sel .dot{box-shadow:0 0 0 4px rgba(255,255,255,.18),0 0 18px rgba(255,255,255,.25)}

.hud{position:absolute;left:16px;top:14px;z-index:6;pointer-events:none;max-width:60%}
.crumb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;pointer-events:auto}
.crumb a{font:500 12px/1 var(--ui);color:var(--ink2);background:rgba(12,13,18,.7);border:1px solid var(--line);border-radius:7px;padding:6px 9px;cursor:pointer}
.crumb a.now{color:var(--accent);border-color:rgba(240,182,95,.4)}
.crumb span{color:var(--ink3)}
.panel{position:absolute;left:16px;bottom:16px;z-index:6;width:300px;background:rgba(11,12,16,.92);border:1px solid var(--line);border-radius:12px;padding:14px 15px;backdrop-filter:blur(8px)}
.panel .k{font:500 10px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.panel .nm{font:500 17px/1.25 var(--serif);margin:7px 0 2px}
.panel .meta{font:400 12.5px/1.5 var(--ui);color:var(--ink2)}
.panel .act{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.panel .act a{font:500 11px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:9px 11px;cursor:pointer;transition:.18s}
.panel .act a:hover{border-color:var(--accent);color:var(--accent)}
.legend{position:absolute;right:16px;bottom:16px;z-index:6;display:flex;flex-direction:column;gap:7px;pointer-events:none;background:rgba(11,12,16,.6);padding:11px 13px;border-radius:10px}
.legend span{display:inline-flex;align-items:center;gap:8px;font:500 11px/1 var(--ui);color:var(--ink2)}
.legend i{width:9px;height:9px;border-radius:50%}
.zoom{position:absolute;right:16px;top:14px;z-index:6;display:flex;flex-direction:column;gap:6px}
.zoom button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:rgba(21,22,28,.85);color:var(--ink);font-size:15px;cursor:pointer}
.zoom button:hover{border-color:var(--accent);color:var(--accent)}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:5;font:400 12px/1 var(--ui);color:var(--ink3);pointer-events:none}
</style>
</head>
<body>
<header>
  <div class="brand"><b>METATAKE</b><span>film graph · explore the connections</span></div>
  <div class="tools">
    <div class="search"><span class="m">⌕</span><input id="film-input" list="film-list" placeholder="Jump to a film…" autocomplete="off"></div>
    <datalist id="film-list"></datalist>
    <button class="btn" id="random">🎲 Random</button>
    <button class="btn" id="recenter">Recenter</button>
  </div>
</header>
<div class="stage" id="stage">
  <div id="world"><svg id="lines"></svg></div>
  <div class="hud"><div class="crumb" id="crumb"></div></div>
  <div class="zoom"><button id="zin">+</button><button id="zout">−</button></div>
  <div class="panel" id="panel"></div>
  <div class="legend">
    <span><i style="background:var(--film)"></i>film</span>
    <span><i style="background:var(--figure)"></i>figure</span>
    <span><i style="background:var(--reading)"></i>reading · meta-take</span>
    <span><i style="background:var(--trope)"></i>trope</span>
  </div>
  <div class="hint">hover to focus · drag to pan · scroll to zoom · click a film to travel into it</div>
</div>

const SITE='https://filmcurio.com';
const stage=document.getElementById('stage'), world=document.getElementById('world'), lines=document.getElementById('lines');
const WX=1500, WY=1000, CX=WX/2, CY=WY/2;

let k=1, tx=0, ty=0;

/* hub slug -> set of seed films that contain it (for film<->film bridges) */
const hubSeeds={};
ROOTS.forEach(function(r){ SEED[r.slug].figures.forEach(function(fg){ fg.hubs.forEach(function(h){ (hubSeeds[h.slug]=hubSeeds[h.slug]||new Set()).add(r.slug); }); }); });

function title(s){ return FILMS[s]?FILMS[s].t:s; }

function build(rootSlug){
  nodes=[]; links=[]; byId={};
  const data=SEED[rootSlug];
  const c=addN({id:'film:'+rootSlug, type:'film', center:true, slug:rootSlug, label:data.title});
  c.fx=CX; c.fy=CY;
  data.figures.forEach(function(fg){
    const fn=addN({id:'fig:'+rootSlug+'/'+fg.slug, type:'figure', label:fg.label, figslug:fg.slug, filmslug:rootSlug});
    addL(c, fn, 'struct');
    fg.hubs.forEach(function(h){
      const hn=addN({id:'hub:'+h.slug, type:h.kind, label:h.title, slug:h.slug, n:h.n});
      addL(fn, hn, h.kind);
      h.films.forEach(function(s){
        const lf=addN({id:'film:'+s, type:'film', leaf:true, slug:s, label:title(s), seed:!!SEED[s]});
        addL(hn, lf, h.kind);
      });
      /* bridge: other seed films sharing this hub -> travelable */
      (hubSeeds[h.slug]||new Set()).forEach(function(os){
        if(os===rootSlug) return;
        const lf=addN({id:'film:'+os, type:'film', leaf:true, slug:os, label:SEED[os].title, seed:true, bridge:true});
        addL(hn, lf, h.kind);
      });
    });
  });
  nodes.forEach(function(n){ n.deg=0; });
  links.forEach(function(l){ l.a.deg++; l.b.deg++; });
}
function addN(o){ if(byId[o.id]) return byId[o.id]; o.x=CX+(Math.random()-.5)*120; o.y=CY+(Math.random()-.5)*120; o.vx=0; o.vy=0; byId[o.id]=o; nodes.push(o); return o; }
function addL(a,b,kind){ for(var i=0;i<links.length;i++){ if(links[i].a===a&&links[i].b===b) return; } links.push({a:a,b:b,kind:kind}); }

function radius(n){ return n.center?13 : n.type==='figure'?6.5 : (n.type==='reading'||n.type==='trope')?5.5 : Math.min(9, 3.5+(n.deg||1)*1.1); }

/* ---- render DOM ---- */
function draw(){
  lines.setAttribute('width',WX); lines.setAttribute('height',WY); lines.setAttribute('viewBox','0 0 '+WX+' '+WY);
  var lp='';
  links.forEach(function(l,i){ l.id='L'+i;
    var col=l.kind==='reading'?'rgba(224,163,74,.22)':l.kind==='trope'?'rgba(79,182,173,.24)':'rgba(233,228,216,.10)';
    lp+='<line id="'+l.id+'" x1="0" y1="0" x2="0" y2="0" stroke="'+col+'" stroke-width="1.1"></line>';
  });
  lines.innerHTML=lp;
  links.forEach(function(l){ l.el=document.getElementById(l.id); });

  Array.prototype.slice.call(world.querySelectorAll('.gnode')).forEach(function(e){e.remove();});
  nodes.forEach(function(n){
    var el=document.createElement('div');
    el.className='gnode '+n.type+(n.center?' center':'')+(n.leaf?' leaf':'')+(n.seed?' seed':'');
    var r=radius(n);
    el.innerHTML='<div class="dot" style="width:'+(r*2)+'px;height:'+(r*2)+'px"></div><div class="lbl" style="font-size:'+(n.center?15:n.leaf?11:12.5)+'px">'+esc(n.label)+'</div>';
    el.addEventListener('mouseenter',function(){focus(n);showPanel(n,true);});
    el.addEventListener('mouseleave',function(){unfocus();});
    el.addEventListener('click',function(e){e.stopPropagation();clickNode(n);});
    el.addEventListener('dblclick',function(e){e.stopPropagation();openPage(n);});
    n.el=el; world.appendChild(el);
  });
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ---- force sim ---- */
function tick(){
  var i,j,a,b,dx,dy,d2,d,f,fx,fy;
  for(i=0;i<nodes.length;i++){ a=nodes[i];
    for(j=i+1;j<nodes.length;j++){ b=nodes[j]; dx=a.x-b.x; dy=a.y-b.y; d2=dx*dx+dy*dy; if(d2<1)d2=1;
      if(d2<140000){ f=3400/d2; d=Math.sqrt(d2); fx=f*dx/d; fy=f*dy/d; a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy; } } }
  for(i=0;i<links.length;i++){ var l=links[i]; var len=l.kind==='struct'?96:l.a.center?150:78;
    dx=l.b.x-l.a.x; dy=l.b.y-l.a.y; d=Math.sqrt(dx*dx+dy*dy)||1; f=(d-len)*0.04; fx=f*dx/d; fy=f*dy/d;
    l.a.vx+=fx; l.a.vy+=fy; l.b.vx-=fx; l.b.vy-=fy; }
  for(i=0;i<nodes.length;i++){ a=nodes[i];
    if(a.fx!=null){ a.x=a.fx; a.y=a.fy; a.vx=0; a.vy=0; }
    else { a.vx+=(CX-a.x)*0.006; a.vy+=(CY-a.y)*0.006; a.vx*=0.85; a.vy*=0.85; a.x+=a.vx; a.y+=a.vy; }
    if(a.el){ a.el.style.left=a.x+'px'; a.el.style.top=a.y+'px'; }
  }
  for(i=0;i<links.length;i++){ var ll=links[i]; if(ll.el){ ll.el.setAttribute('x1',ll.a.x); ll.el.setAttribute('y1',ll.a.y); ll.el.setAttribute('x2',ll.b.x); ll.el.setAttribute('y2',ll.b.y); } }
  requestAnimationFrame(tick);
}

/* ---- focus / hover ---- */
function neighbors(n){ var s=new Set([n]); links.forEach(function(l){ if(l.a===n)s.add(l.b); if(l.b===n)s.add(l.a); }); return s; }
function focus(n){ var nb=neighbors(n);
  nodes.forEach(function(m){ m.el.classList.toggle('dim', !nb.has(m)); });
  links.forEach(function(l){ var on=(l.a===n||l.b===n); if(l.el){ l.el.setAttribute('stroke', on?(l.kind==='trope'?'#4fb6ad':l.kind==='reading'?'#e0a34a':'rgba(233,228,216,.5)'):baseCol(l.kind)); l.el.setAttribute('stroke-width', on?'1.9':'1.1'); } });
}
function unfocus(){ nodes.forEach(function(m){ m.el.classList.remove('dim'); }); links.forEach(function(l){ if(l.el){ l.el.setAttribute('stroke',baseCol(l.kind)); l.el.setAttribute('stroke-width','1.1'); } }); }
function baseCol(kind){ return kind==='reading'?'rgba(224,163,74,.22)':kind==='trope'?'rgba(79,182,173,.24)':'rgba(233,228,216,.10)'; }

/* ---- interactions ---- */
function clickNode(n){
  select(n);
  if(n.type==='film' && !n.center){ if(SEED[n.slug]) travel(n.slug); else openPage(n); }
}
function select(n){ if(selected&&selected.el)selected.el.classList.remove('sel'); selected=n; if(n.el)n.el.classList.add('sel'); showPanel(n,false); }
function pageOf(n){ if(n.type==='figure')return '/film/'+n.filmslug+'/figure/'+n.figslug; if(n.type==='reading')return '/take/'+n.slug; if(n.type==='trope')return '/trope/'+n.slug; return '/film/'+n.slug; }
function openPage(n){ window.open(SITE+pageOf(n),'_blank'); }

function showPanel(n,hover){
  var p=document.getElementById('panel');
  var kind=n.center?'this film':n.type==='figure'?'figure':n.type==='reading'?'reading · meta-take':n.type==='trope'?'trope':(n.seed?'film · click to travel':'film');
  var meta=n.center?(SEED[root].figures.length+' figures · the centre of this graph')
    :n.type==='figure'?'a concrete element in this film · branch of readings + a trope'
    :(n.type==='reading'||n.type==='trope')?(n.n+' films share this'+(n.type==='reading'?' reading':' trope'))
    :(n.bridge?'also runs through this graph — click to travel':(n.seed?'in your library — click to travel':'click to open on the site'));
  p.innerHTML='<div class="k">'+kind+'</div><div class="nm">'+esc(n.label)+'</div><div class="meta">'+meta+'</div>'+
    '<div class="act"><a id="pa-open">open page ↗</a>'+((n.type==='film'&&!n.center&&SEED[n.slug])?'<a id="pa-travel">travel into ↻</a>':'')+'</div>';
  var o=document.getElementById('pa-open'); if(o)o.onclick=function(){openPage(n);};
  var t=document.getElementById('pa-travel'); if(t)t.onclick=function(){travel(n.slug);};
}

/* ---- travel between films ---- */
function travel(slug){ if(!SEED[slug]||slug===root) return; root=slug;
  trail.push(slug); if(trail.length>6) trail.shift();
  resetView(); build(root); draw(); renderCrumb(); document.getElementById('film-input').value=SEED[root].title; select(byId['film:'+root]);
}
function setRoot(slug){ if(!SEED[slug]) return; root=slug; trail=[slug]; resetView(); build(root); draw(); renderCrumb(); document.getElementById('film-input').value=SEED[root].title; select(byId['film:'+root]); }
function renderCrumb(){ var c=document.getElementById('crumb'); c.innerHTML='';
  trail.forEach(function(s,i){ var a=document.createElement('a'); a.textContent=SEED[s].title; if(i===trail.length-1)a.className='now'; a.onclick=function(){ trail=trail.slice(0,i+1); root=s; resetView(); build(root); draw(); renderCrumb(); select(byId['film:'+root]); }; c.appendChild(a); if(i<trail.length-1){ var sp=document.createElement('span'); sp.textContent='›'; c.appendChild(sp); } });
}

/* ---- pan / zoom ---- */
function applyView(){ world.style.transform='translate('+tx+'px,'+ty+'px) scale('+k+')'; }
function resetView(){ k=1; tx=(stage.clientWidth/2-CX); ty=(stage.clientHeight/2-CY); applyView(); }
document.getElementById('zin').onclick=function(){ zoomAt(stage.clientWidth/2,stage.clientHeight/2,1.2); };
document.getElementById('zout').onclick=function(){ zoomAt(stage.clientWidth/2,stage.clientHeight/2,1/1.2); };
function zoomAt(px,py,factor){ var nk=Math.max(.35,Math.min(2.4,k*factor)); var wx=(px-tx)/k, wy=(py-ty)/k; k=nk; tx=px-wx*k; ty=py-wy*k; applyView(); }
stage.addEventListener('wheel',function(e){ e.preventDefault(); zoomAt(e.clientX, e.clientY-stage.getBoundingClientRect().top, e.deltaY<0?1.12:1/1.12); },{passive:false});
(function(){ var down=false,sx,sy,ox,oy;
  stage.addEventListener('pointerdown',function(e){ if(e.target.closest('.gnode'))return; down=true; stage.classList.add('drag'); sx=e.clientX; sy=e.clientY; ox=tx; oy=ty; });
  window.addEventListener('pointermove',function(e){ if(!down)return; tx=ox+(e.clientX-sx); ty=oy+(e.clientY-sy); applyView(); });
  window.addEventListener('pointerup',function(){ down=false; stage.classList.remove('drag'); });
})();

/* ---- controls ---- */
ROOTS.forEach(function(r){ var o=document.createElement('option'); o.value=r.title; document.getElementById('film-list').appendChild(o); });
document.getElementById('film-input').addEventListener('change',function(){ var v=this.value.trim().toLowerCase(); var hit=ROOTS.find(function(r){return r.title.toLowerCase()===v;}); if(hit)setRoot(hit.slug); });
document.getElementById('random').onclick=function(){ var r=ROOTS[Math.floor(Math.random()*ROOTS.length)]; setRoot(r.slug); };
document.getElementById('recenter').onclick=function(){ resetView(); };
window.addEventListener('resize',function(){ resetView(); });

/* ---- boot ---- */
build(root); draw(); resetView(); renderCrumb(); document.getElementById('film-input').value=SEED[root].title; select(byId['film:'+root]);
requestAnimationFrame(tick);
})();
</script>
</body>
